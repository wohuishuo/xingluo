plugins { id 'com.android.application' }
def signingProps = new Properties()
def signingFile = rootProject.file('release-signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
android {
    namespace 'app.xingluo.video'
    compileSdk 35
    defaultConfig {
        applicationId 'app.xingluo.video'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
        testInstrumentationRunner 'app.xingluo.video.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { release {
        if(signingFile.exists()) { storeFile rootProject.file(signingProps['storeFile']); storePassword signingProps['storePassword']; keyAlias signingProps['keyAlias']; keyPassword signingProps['keyPassword'] }
    } }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    testOptions { unitTests.returnDefaultValues = true }
}
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303' }
