plugins { id 'com.android.application' }
def signingProps = new Properties()
def signingFile = rootProject.file('release-signing.properties')
if (signingFile.exists()) signingFile.withInputStream { signingProps.load(it) }
android {
    namespace 'app.xingluo.video'
    compileSdk 35
    defaultConfig {
        applicationId 'app.xingluo.video'
        minSdk 28
        targetSdk 35
        versionCode 4
        versionName '2.0.0'
        testInstrumentationRunner 'app.xingluo.video.SmokeInstrumentation'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    signingConfigs {
        release {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingProps['storeFile'])
                storePassword signingProps['storePassword']
                keyAlias signingProps['keyAlias']
                keyPassword signingProps['keyPassword']
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
                enableV4Signing false
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    testOptions {
        unitTests.returnDefaultValues = true
    }
}
dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
