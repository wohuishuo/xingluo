<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>星落 Xingluo Bridge</title>
  <style>
    :root {
      --bg: #FAF9F6;
      --surface: #FFFFFF;
      --line: #EBE7EF;
      --lilac: #EEE9F8;
      --lilac-soft: #F5F2FB;
      --purple: #7E69BD;
      --purple-grad-a: #9480CD;
      --purple-grad-b: #7B65B8;
      --ink: #302B41;
      --muted: #898396;
      --ok-bg: #EDF4ED;
      --ok-fg: #527459;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-width: 320px;
      width: 360px;
      max-width: 100vw;
    }

    .wrap {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: var(--lilac);
      color: var(--purple);
      display: grid;
      place-items: center;
      font-size: 18px;
      font-weight: 700;
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .brand-title {
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
      color: var(--ink);
    }

    .brand-sub {
      font-size: 9px;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .badge {
      padding: 5px 10px;
      border-radius: 999px;
      background: var(--lilac);
      color: var(--purple);
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 13px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .page-title {
      font-size: 13px;
      font-weight: 600;
      line-height: 1.45;
      color: var(--ink);
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .page-url {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.35;
      word-break: break-all;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn-primary {
      width: 100%;
      min-height: 44px;
      border: none;
      border-radius: 14px;
      padding: 11px 16px;
      background: linear-gradient(135deg, var(--purple-grad-a), var(--purple-grad-b));
      color: #FFFFFF;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.12s ease, opacity 0.12s ease;
    }

    .btn-primary:active {
      transform: scale(0.985);
    }

    .btn-primary:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .btn-secondary {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 8px 12px;
      background: var(--lilac-soft);
      color: var(--purple);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-secondary[hidden] {
      display: none;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      margin-top: 2px;
    }

    .section-count {
      font-size: 11px;
      font-weight: 500;
      color: var(--muted);
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 210px;
      overflow-y: auto;
    }

    .item-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 10px;
      border-radius: 13px;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .item-check {
      width: 16px;
      height: 16px;
      accent-color: var(--purple);
      flex-shrink: 0;
      cursor: pointer;
    }

    .item-info {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .item-label {
      font-size: 12px;
      font-weight: 600;
      color: var(--ink);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-url {
      font-size: 10px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .item-send {
      border: none;
      border-radius: 10px;
      padding: 6px 10px;
      background: var(--lilac);
      color: var(--purple);
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      flex-shrink: 0;
    }

    .images-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .thumb-btn {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 0;
      overflow: hidden;
      background: var(--surface);
      aspect-ratio: 1;
      cursor: pointer;
      position: relative;
    }

    .thumb-btn img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .status {
      font-size: 11px;
      color: var(--muted);
      text-align: center;
      padding: 6px 10px;
      border-radius: 10px;
      background: var(--surface);
      border: 1px solid var(--line);
    }

    .status.ok {
      background: var(--ok-bg);
      color: var(--ok-fg);
      border-color: transparent;
    }

    .empty-hint {
      font-size: 11px;
      color: var(--muted);
      line-height: 1.5;
      padding: 8px 2px 2px;
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">✦</div>
        <div class="brand-text">
          <div class="brand-title">星落</div>
          <div class="brand-sub">Xingluo Bridge</div>
        </div>
      </div>
      <span id="platform-badge" class="badge">网页检测中</span>
    </header>

    <section class="card" aria-label="当前页面">
      <div id="page-title" class="page-title">正在读取页面信息…</div>
      <div id="page-url" class="page-url"></div>
    </section>

    <div class="actions">
      <button id="send-primary" class="btn-primary" type="button" disabled>发送到星落下载 ✦</button>
      <button id="send-batch" class="btn-secondary" type="button" hidden>批量发送到星落</button>
    </div>

    <div id="status-banner" class="status" hidden></div>

    <section id="media-section" hidden>
      <div class="section-head">
        <span>识别到的媒体与链接</span>
        <span id="media-count" class="section-count"></span>
      </div>
      <div id="media-list" class="item-list"></div>
    </section>

    <section id="images-section" hidden>
      <div class="section-head">
        <span>发现的图片</span>
        <span id="images-count" class="section-count"></span>
      </div>
      <div id="images-grid" class="images-grid"></div>
    </section>

    <div id="empty-hint" class="empty-hint" hidden></div>
  </main>

  <script src="popup.js"></script>
</body>
</html>
